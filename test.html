<!DOCTYPE html>
<html>
<head>
    <title>Firebase Auth Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Firebase Authentication Test</h1>
    
    <button onclick="testGoogle()">🔵 Test Google Sign-In</button>
    <button onclick="testApple()">🍎 Test Apple Sign-In</button>
    <button onclick="testProtected()">🔒 Test Protected Route</button>
    
    <div id="result"></div>

    <script>
        // Replace with your Firebase config from Firebase Console → Project Settings → Web App
      const firebaseConfig = {
     apiKey: "AIzaSyD15R0k6UG1Np0BmbLOHimy9bg2GmlVHSc",
     authDomain: "my-trainr-ai.firebaseapp.com",
     projectId: "my-trainr-ai",
     storageBucket: "my-trainr-ai.firebasestorage.app",
     messagingSenderId: "769847498503",
     appId: "1:769847498503:web:6dd8f4b8cac79385d0d7a2"
};
        
        firebase.initializeApp(firebaseConfig);
        let accessToken = null;

        async function testGoogle() {
            try {
                showResult('Opening Google sign-in popup...', 'info');
                
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                
                showResult('Got Google user, getting ID token...', 'info');
                const idToken = await result.user.getIdToken();
                
                showResult('Sending ID token to backend...', 'info');
                const response = await fetch('http://localhost:3000/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    accessToken = data.accessToken;
                    showResult(`✅ Success! User: ${data.user.email}, New User: ${data.isNewUser}`, 'success');
                    showResult(`Access Token: ${accessToken}`, 'success');
                } else {
                    showResult(`❌ Error: ${data.message}`, 'error');
                }
                
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        async function testApple() {
            try {
                showResult('Opening Apple sign-in popup...', 'info');
                
                const provider = new firebase.auth.OAuthProvider('apple.com');
                const result = await firebase.auth().signInWithPopup(provider);
                
                showResult('Got Apple user, getting ID token...', 'info');
                const idToken = await result.user.getIdToken();
                
                showResult('Sending ID token to backend...', 'info');
                const response = await fetch('http://localhost:3000/api/auth/apple', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        idToken,
                        user: result.user.providerData[0] || {}
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    accessToken = data.accessToken;
                    showResult(`✅ Success! User: ${data.user.email}, New User: ${data.isNewUser}`, 'success');
                    showResult(`Access Token: ${accessToken}`, 'success');
                } else {
                    showResult(`❌ Error: ${data.message}`, 'error');
                }
                
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        async function testProtected() {
            if (!accessToken) {
                showResult('❌ Please sign in first!', 'error');
                return;
            }

            try {
                showResult('Testing protected route...', 'info');
                
                const response = await fetch('http://localhost:3000/api/users/me', {
                    headers: { 
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Protected route works! User: ${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    showResult(`❌ Protected route error: ${data.message}`, 'error');
                }
                
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="${type}">${message}</div>`;
            console.log(message);
        }
    </script>
</body>
</html>
